%YAML 1.2
---
$id: http://devicetree.org/schemas/net/zte,zx279128s-eth.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ZTE ZX279128S integrated Ethernet controller

maintainers:
  - Agustin Isasmendi <isasmendi.agus@gmail.com>

description:
  The ZTE ZX279128S SoC integrates a 5-port Gigabit Ethernet switch with
  four internal GePHYs (plus one MAC for an external RGMII PHY), a
  hardware packet processor (NPP), programmable classifier (CLA), packet
  modifier engine (PM), forwarding database (FDB), and a Traffic Manager
  (TM) with IDM DMA rings for CPU-to-switch traffic.

  The driver provides DSA multi-port support with a zte-specific tagger.
  Hardware flow-offload is available via nft-flowtable when the required
  firmware register tables (stock_init block) are loaded.

properties:
  compatible:
    const: "zte,zx279128s-eth"

  reg:
    maxItems: 5
    description:
      Register windows for the on-chip switch and associated blocks.

  reg-names:
    items:
      - const: pon
      - const: npp
      - const: sys_ctrl
      - const: pin_mux
      - const: pon_serdes

  interrupts:
    minItems: 5
    maxItems: 5
    description:
      Hardware interrupt lines. "tm" is the primary CPU-switch traffic IRQ.

  interrupt-names:
    items:
      - const: idm
      - const: npp
      - const: tm
      - const: pon
      - const: pp

  zte,topcrm:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the TOPCRM clock/reset controller node.

  zte,gephys:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description:
      Array of up to 5 phandles to the internal GePHY nodes
      (gephy0 through gephy3, plus an optional wanphy for the
      external RGMII port).

  memory-region:
    maxItems: 1
    description:
      Reserved memory region for BMU buffer pools, ACL RAM,
      flow RAM, and descriptor rings. This is the pdt_mem
      carved region matching stock firmware layout at
      0x4C000000-0x4FFFFFFF (64 MiB).

  status: true

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - zte,gephys

additionalProperties: true

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    eth {
        compatible = "zte,zx279128s-eth";
        reg = <0x92000000 0x1c0000>,
              <0x921c0000 0x200000>,
              <0x94100000 0x1000>,
              <0x94200000 0x1000>,
              <0x9fe00000 0x100000>;
        reg-names = "pon", "npp", "sys_ctrl", "pin_mux", "pon_serdes";
        interrupts = <GIC_SPI 38 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 35 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 36 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 66 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 37 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "idm", "npp", "tm", "pon", "pp";
        zte,topcrm = <&topcrm 0>;
        zte,gephys = <&gephy0>, <&gephy1>, <&gephy2>, <&gephy3>;
        memory-region = <&carved>;
    };
