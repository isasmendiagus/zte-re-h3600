%YAML 1.2
---
$id: http://devicetree.org/schemas/net/zte,zx279128s-eth.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ZTE ZXIC ZX279128S integrated Ethernet controller

description: |
  The ZX279128S SoC integrates an Ethernet block built around a packet
  processor pipeline:

      RJ45 → GePHY → MAC[0..3] → on-chip switch (SW)
                              → packet processor (PP)
                              → DDR via PP_AXI / IDM ring

  Four MACs feed a 4-port on-chip switch. The switch hands frames to
  the Packet Processor (PP) which elevates them to the Network Packet
  Processor (NPP) / IDM DMA ring, where the host driver reads them out
  via an in-RAM descriptor pool (BMU). The same path runs in reverse
  for transmit.

  The driver targets two physically separate MMIO windows:
    * 0x92000000 .. 0x921bffff  PON-side blocks (smac/sbrg/dpa/sda/sdet)
    * 0x921c0000 .. 0x923bffff  NPP / TM / PP / IDM register file

  In addition the driver pokes the SoC top-level clock/reset manager
  (TOPCRM at 0x94000000) to enable PON-side clocks during probe.

  Note (planned per-block split): a sibling ZX279128R reference DTS
  (kept in refs/zte-zx279128R/ in this project) treats each HW block
  (pon, npp, sw, tm, pp, idm, mdio, gephy) as a separate DT node with
  its own compatible. That is the upstream-correct shape and the
  target architecture for this driver — likely as a Linux DSA driver
  with a CPU conduit (NPP+IDM) plus user-port PHY drivers. This YAML
  documents the current monolithic intermediate; future revisions will
  split it apart.

maintainers:
  - Agustin Isasmendi <infra@quecomere.com>

allOf:
  - $ref: ethernet-controller.yaml#

properties:
  compatible:
    const: zte,zx279128s-eth

  reg:
    minItems: 5
    items:
      - description: PON-side register window (MAC[0..4], smac/sbrg/dpa/sda/sdet)
      - description: NPP / TM / PP / IDM register window
      - description: sys_ctrl (SoC system control registers)
      - description: pin_mux (pin multiplexing control)
      - description: pon_serdes (SERDES calibration and PLL control)

  reg-names:
    minItems: 5
    items:
      - const: pon
      - const: npp
      - const: sys_ctrl
      - const: pin_mux
      - const: pon_serdes

  interrupts:
    minItems: 5
    items:
      - description: IDM DMA ring interrupt (WiFi forwarding)
      - description: NPP main interrupt (packet processor events)
      - description: TM interrupt (traffic manager — primary CPU↔SW path)
      - description: PON main interrupt (defensive, 0 fires on stock)
      - description: PP interrupt (defensive, packet processor events)

  interrupt-names:
    minItems: 5
    items:
      - const: idm
      - const: npp
      - const: tm
      - const: pon
      - const: pp

  zte,topcrm:
    description: |
      phandle to the TOPCRM syscon node. The driver writes a small set
      of PON-clock enable bits and reads back the "PON clocks ready"
      status word from this region during probe.
    $ref: /schemas/types.yaml#/definitions/phandle

  zte,gephys:
    description: |
      List of phandles to the ZTE GePHY nodes. The driver calls
      phy_init_hw() on each during probe to run the vendor LDO + TX DAC
      power-up sequence. Order: gePhY0..3 (LAN ports), then wanphy (WAN).
    $ref: /schemas/types.yaml#/definitions/phandle-array

  memory-region:
    description: |
      Reserved memory region for the BMU carved slab (64 MiB at top of
      RAM). Contains BPPE buffer-pointer table, BP buffers, ACL RAM,
      flow RAM, and TX/RX descriptor rings.
    maxItems: 1

  conduit:
    type: object
    additionalProperties: false
    description: |
      Anchor node for the CPU-side "sw" netdev. The controller registers
      several netdevs (the switch CPU netdev plus the wifi-offload netdevs),
      all parented to this controller node. of_find_net_device_by_node()
      walks dev->parent, so referencing the controller node directly would
      ambiguously match every one of them (and registration order, not
      intent, would decide the winner). When the on-chip switch is used as
      a DSA switch, its CPU port must reference THIS child node
      (ethernet = <&conduit_label>); the driver sets only the "sw" netdev's
      of_node to it, so it is the sole match.

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - zte,topcrm

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    soc {
        #address-cells = <1>;
        #size-cells = <1>;

        topcrm: syscon@94000000 {
            compatible = "zte,zx279128s-topcrm", "syscon";
            reg = <0x94000000 0x1000>;
        };

        ethernet@921c0000 {
            compatible = "zte,zx279128s-eth";
            reg = <0x92000000 0x1c0000>,
                  <0x921c0000 0x200000>,
                  <0x94100000 0x1000>,
                  <0x94200000 0x1000>,
                  <0x9fe00000 0x100000>;
            reg-names = "pon", "npp", "sys_ctrl", "pin_mux", "pon_serdes";

            interrupts = <GIC_SPI 0x26 IRQ_TYPE_LEVEL_HIGH>,
                         <GIC_SPI 0x23 IRQ_TYPE_LEVEL_HIGH>,
                         <GIC_SPI 0x24 IRQ_TYPE_LEVEL_HIGH>,
                         <GIC_SPI 0x42 IRQ_TYPE_LEVEL_HIGH>,
                         <GIC_SPI 0x25 IRQ_TYPE_LEVEL_HIGH>;
            interrupt-names = "idm", "npp", "tm", "pon", "pp";

            zte,topcrm = <&topcrm>;
            zte,gephys = <&gephy0>, <&gephy1>, <&gephy2>, <&gephy3>, <&wanphy>;
            local-mac-address = [00 11 22 33 44 55];

            conduit {
            };
        };
    };
