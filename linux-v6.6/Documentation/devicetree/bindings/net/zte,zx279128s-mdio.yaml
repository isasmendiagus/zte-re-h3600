%YAML 1.2
---
$id: http://devicetree.org/schemas/net/zte,zx279128s-mdio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ZTE ZXIC ZX279128S MDIO bus controller

description: |
  Small (24-byte) MDIO master block embedded in the ZX279128S SoC,
  used to drive the four built-in GePHYs that sit behind the on-chip
  switch. Standard IEEE 802.3 Clause-22 transactions only; no C45.

maintainers:
  - Agustin Isasmendi <infra@quecomere.com>

allOf:
  - $ref: mdio.yaml#

properties:
  compatible:
    const: zte,zx279128s-mdio

  reg:
    maxItems: 1
    description: 24-byte register window

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    mdio@9a101000 {
        compatible = "zte,zx279128s-mdio";
        reg = <0x9a101000 0x18>;
        #address-cells = <1>;
        #size-cells = <0>;

        ethernet-phy@0 {
            reg = <0>;
        };
    };
