# hostapd AP test config — H3600 MT7915 wlan1 (5 GHz).
# Proven working on the live H3600 (mainline 6.6, #516) 2026-07-07:
# reached AP-ENABLED; a real Android STA associated (WPA2-PSK 4-way handshake),
# got a DHCP lease (192.168.50.10) from busybox udhcpd, and AP->STA ICMP was
# 3/3 0% loss.
#
# The SSID is deliberately RENAMED away from the owner's home AP
# ("Dino-WiFi-5GHz") so a radiating test AP cannot confuse the owner's clients.
# The passphrase here is a THROWAWAY TEST passphrase (not any owner secret) —
# safe to keep in-tree.
#
# Bring-up on device:
#   ip addr add 192.168.50.1/24 dev wlan1
#   busybox udhcpd -S /tmp/udhcpd.conf         # start=.10 end=.100 router=.1
#   iw reg set ES                              # needs the wens-cert regdb fix
#   /bin/hostapd -B -t /tmp/hostapd.conf
interface=wlan1
driver=nl80211
ssid=H3600-AP-Test
country_code=ES
hw_mode=a
channel=36
ieee80211n=1
wmm_enabled=1
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=h3600aptest
